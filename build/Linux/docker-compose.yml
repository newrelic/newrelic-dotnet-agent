services:
    build_deb: 
        build: ./build/deb 
        command: bash -c "dos2unix /deb/build.sh && chmod 755 -R /deb && chmod 777 /deb/build.sh && /deb/build.sh && /deb/build.sh arm64"
        volumes: 
            - ../../src/_build/CoreArtifacts:/release
            - ../../src/Agent:/data
            - ../../src/Agent/Miscellaneous:/docs
            - ./build/deb:/deb
            - ./build/common:/common
        working_dir: /data

    build_rpm:
        build: ./build/rpm
        command: bash -c "dos2unix /rpm/build.sh && chmod 777 /rpm/build.sh && /rpm/build.sh"
        # Name-only: the value comes from the calling shell, so it never appears on a command line.
        environment:
            - GPG_KEY_PASSPHRASE
        volumes:
            - ../../src/_build/CoreArtifacts:/release
            - ../../src/Agent:/data
            - ../../src/Agent/Miscellaneous:/docs
            - ./build/rpm:/rpm
            - ./build/common:/common
            - ${GPG_KEYS_DIR:-./keys}:/keys:ro
        working_dir: /data

    test_debian:
        build: ./test/distros/debian
        command: bash -c "dos2unix /test/test.sh &>/dev/null && chmod 777 /test/test.sh && /test/test.sh"
        volumes:
            - ../../src/_build/CoreArtifacts:/release
            - ./test/scripts:/test
        working_dir: /data

    test_rockylinux:
        build: ./test/distros/rockylinux
        command: bash -c "dos2unix /test/test.sh &>/dev/null && chmod 777 /test/test.sh && /test/test.sh"
        volumes:
            - ../../src/_build/CoreArtifacts:/release
            - ./test/scripts:/test
        working_dir: /data
