name: Setup Pinned .NET SDK
description: >
  Installs the exact .NET SDK named in a global.json-format pin file into a
  job-private directory (so the runner image's preinstalled SDKs and runtimes
  are not on the dotnet path), copies the pin file to the workspace root for
  the rest of the job so the dotnet host selects that SDK, and fails the job
  unless `dotnet --version` reports the pinned version. The pin file lives
  outside the repository root (by default .github/dotnet-sdk/global.json) so
  local developer builds are unaffected. Reusable from other repositories: the
  pin file path is relative to the caller's workspace, and the caller must
  check out its repository first. Tested on Windows and Linux runners.

inputs:
  global-json-file:
    description: >
      Path of the pin file, relative to the workspace. It must be global.json
      format with an exact sdk.version and a non-"latest*" rollForward
      ("disable" is recommended), otherwise actions/setup-dotnet floats.
    required: false
    default: .github/dotnet-sdk/global.json

outputs:
  dotnet-version:
    description: The pinned .NET SDK version, confirmed by `dotnet --version`.
    value: ${{ steps.assert.outputs.dotnet-version }}

runs:
  using: composite
  steps:
    - name: Read the SDK pin
      id: pin
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        PIN_FILE: ${{ inputs.global-json-file }}
      run: |
        $pinPath = Join-Path $env:GITHUB_WORKSPACE $env:PIN_FILE
        if (-not (Test-Path -LiteralPath $pinPath -PathType Leaf)) {
          Write-Output "::error::SDK pin file not found: $pinPath"
          exit 1
        }
        $pinPath = (Resolve-Path -LiteralPath $pinPath).Path
        $sdk = (Get-Content -LiteralPath $pinPath -Raw | ConvertFrom-Json).sdk
        $version = "$($sdk.version)"
        if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') {
          Write-Output "::error::$env:PIN_FILE must set sdk.version to an exact SDK version, got '$version'."
          exit 1
        }
        if ("$($sdk.rollForward)" -like 'latest*') {
          Write-Output "::error::$env:PIN_FILE sets rollForward '$($sdk.rollForward)', which makes actions/setup-dotnet install a floating version. Use 'disable'."
          exit 1
        }

        # The root copy is what makes the host select the pinned SDK. Refuse to
        # overwrite a root global.json that says something else.
        $rootPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'
        if ((Test-Path -LiteralPath $rootPath) -and
            ((Get-Content -LiteralPath $rootPath -Raw).Trim() -replace "`r`n", "`n") -ne ((Get-Content -LiteralPath $pinPath -Raw).Trim() -replace "`r`n", "`n")) {
          Write-Output "::error::$rootPath already exists and differs from $env:PIN_FILE. Remove it or make it identical."
          exit 1
        }

        # A job-private install directory keeps the image's preinstalled SDKs and
        # runtimes off the dotnet path, so tools built for an older runtime must
        # roll forward to the pinned SDK's runtime instead of using the image's.
        # setup-dotnet installs here and points PATH and DOTNET_ROOT at it.
        $installDir = Join-Path $env:RUNNER_TEMP 'dotnet-pinned'
        "DOTNET_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

        "path=$pinPath" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        Write-Output "Pinned .NET SDK: $version (from $env:PIN_FILE), installing to $installDir"

    - name: Install pinned .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.pin.outputs.path }}
        skip-lts-prepass: true

    - name: Select and verify the pinned .NET SDK
      id: assert
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        PIN_PATH: ${{ steps.pin.outputs.path }}
        PINNED_VERSION: ${{ steps.pin.outputs.version }}
      run: |
        Copy-Item -LiteralPath $env:PIN_PATH -Destination (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Force

        Write-Output "dotnet on PATH: $((Get-Command dotnet).Source)"
        Write-Output 'Installed SDKs:'
        dotnet --list-sdks
        Write-Output 'Installed runtimes:'
        dotnet --list-runtimes

        $actual = (dotnet --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -ne $env:PINNED_VERSION) {
          Write-Output "::error::dotnet --version reported '$actual', expected the pinned SDK $env:PINNED_VERSION."
          exit 1
        }

        "dotnet-version=$actual" >> $env:GITHUB_OUTPUT
        "Pinned .NET SDK **$actual** selected and verified with ``dotnet --version`` on $env:RUNNER_OS ($env:ImageOS $env:ImageVersion)." >> $env:GITHUB_STEP_SUMMARY
        Write-Output "dotnet --version: $actual (matches the pin)"
