name: Build Linux Package
description: >
  Builds the .deb or .rpm package with build/Linux/docker-compose.yml from the
  "homefolders" and "msi-build-folder-artifacts" artifacts of the same run, and
  uploads it as "debian-build-artifacts" or "rpm-build-artifacts". The caller must check out the
  repository first. An RPM is GPG-signed only when gpg-keys-dir is set; the
  caller writes the key there and removes it afterwards.

inputs:
  package:
    description: "'deb' or 'rpm'."
    required: true
  agent-version:
    description: 'Agent version from build-agent, e.g. 10.49.0 or 10.49.0.0.'
    required: true
  gpg-keys-dir:
    description: 'RPM only: directory holding private_gpg_key.gpg. Leave empty for an unsigned package.'
    required: false
    default: ''
  gpg-key-passphrase:
    description: 'RPM only: passphrase for the key in gpg-keys-dir.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download msi _build Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: msi-build-folder-artifacts
        path: src/_build

    - name: Download Agent Home Folders
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: homefolders
        path: src/Agent

    - name: Build package
      env:
        PACKAGE: ${{ inputs.package }}
        BUILD_AGENT_VERSION: ${{ inputs.agent-version }}
        GPG_KEYS_DIR: ${{ inputs.gpg-keys-dir }}
        # Passed to the container by name (build/Linux/docker-compose.yml), not on the command line.
        GPG_KEY_PASSPHRASE: ${{ inputs.gpg-key-passphrase }}
      run: |
        if [[ "$PACKAGE" != "deb" && "$PACKAGE" != "rpm" ]]; then
          echo "::error::package must be 'deb' or 'rpm'."
          exit 1
        fi

        agentVersion="$BUILD_AGENT_VERSION"
        if [[ "$agentVersion" =~ [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          major=$(echo $agentVersion | cut -d'.' -f1)
          minor=$(echo $agentVersion | cut -d'.' -f2)
          patch=$(echo $agentVersion | cut -d'.' -f3)
          agentVersion="${major}.${minor}.${patch}"
          echo "agentVersion is simplified to $agentVersion"
        fi

        signArgs=()
        if [[ -n "$GPG_KEYS_DIR" ]]; then
          if [[ "$PACKAGE" != "rpm" ]]; then
            echo "::error::Only the rpm package is signed at build time."
            exit 1
          fi
          # docker-compose.yml mounts GPG_KEYS_DIR read-only at /keys.
          signArgs=(-e GPG_KEY=/keys/private_gpg_key.gpg)
        else
          # Unsigned: let the compose file fall back to its default (empty) key directory.
          unset GPG_KEYS_DIR
        fi

        cd "${{ github.workspace }}/build/Linux"
        docker compose build "build_$PACKAGE"
        docker compose run -e AGENT_VERSION="$agentVersion" "${signArgs[@]}" "build_$PACKAGE"
      shell: bash

    - name: Archive package artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.package == 'rpm' && 'rpm' || 'debian' }}-build-artifacts
        path: ${{ github.workspace }}/src/_build/CoreArtifacts
        if-no-files-found: error
