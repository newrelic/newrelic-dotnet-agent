name: Run ArtifactBuilder
description: >
  Runs build/package.ps1 over the "homefolders", "msi-build-folder-artifacts",
  "debian-build-artifacts" and "rpm-build-artifacts" artifacts of the same run
  and uploads the result as "deploy-artifacts". The caller must check out the
  repository (full history) first.

inputs:
  verify-msi-signature:
    description: "'true' to fail on an unsigned MSI (release builds), 'false' for CI builds that package unsigned MSIs."
    required: true

runs:
  using: composite
  steps:
    - name: Install latest .NET 10 SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    - name: Download Agent Home Folders
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: homefolders
        path: src/Agent

    - name: Download msi _build Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: msi-build-folder-artifacts
        path: src/_build

    - name: Download Debian _build Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: debian-build-artifacts
        path: src/_build/CoreArtifacts

    - name: Download RPM _build Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: rpm-build-artifacts
        path: src/_build/CoreArtifacts

    - name: Run ArtifactBuilder
      env:
        VERIFY_MSI_SIGNATURE: ${{ inputs.verify-msi-signature }}
      run: |
        if ($env:VERIFY_MSI_SIGNATURE -eq 'false') {
          $env:NR_SKIP_MSI_SIGNATURE_CHECK = 'true'
        }
        elseif ($env:VERIFY_MSI_SIGNATURE -ne 'true') {
          Write-Host "::error::verify-msi-signature must be 'true' or 'false'."
          exit 1
        }
        & "${{ github.workspace }}\build\package.ps1" -configuration Release -IncludeDownloadSite
        exit $LastExitCode
      shell: powershell

    - name: Archive Deploy Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: deploy-artifacts
        path: |
          ${{ github.workspace }}\build\BuildArtifacts
        if-no-files-found: error
