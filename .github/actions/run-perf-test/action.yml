name: Run Performance Test
description: >
  Downloads the New Relic .NET agent (when requested) and runs the performance
  test suite via run-perf-test.py, then uploads the results and log artifacts.

inputs:
  run-label:
    description: 'Short label for this run, used as the artifact name suffix (e.g. "no-agent", "latest-release")'
    required: true
  attach-agent:
    description: 'Attach the New Relic .NET agent to the test app'
    default: 'false'
  agent-source:
    description: 'Source of the agent binaries: github_release (the published Linux tarball from the download site) or build_artifact (only used when attach-agent is true)'
    default: 'github_release'
  agent-version:
    description: 'Agent version to use, e.g. "10.49.0". Leave empty for latest. Only used with agent-source: github_release.'
    default: ''
  build-run-id:
    description: 'Run ID of the all_solutions.yml workflow to pull agent homefolders from. Only used with agent-source: build_artifact.'
    default: ''
  test-duration:
    description: 'How long to drive traffic (Locust --run-time format, e.g. "2m", "5m", "30s")'
    default: '2m'
  locust-users:
    description: 'Number of concurrent Locust users'
    default: '10'
  locust-spawn-rate:
    description: 'Locust users to spawn per second'
    default: '2'
  dotnet-version:
    description: '.NET version for the test app container (e.g. "10.0", "8.0")'
    default: '10.0'
  enabled-tasks:
    description: 'Comma-separated Locust task names to exercise (empty = all). Valid: simple, nested_async, rabbitmq_publish, rabbitmq_consume, redis_crud, mongo_crud, health.'
    default: ''
  license-key:
    description: 'New Relic license key (only used when attach-agent is true)'
    default: ''
  collector-host:
    description: 'New Relic collector host (only used when attach-agent is true)'
    default: ''
  agent-env:
    description: 'Extra environment variables for the test app/agent, semicolon-separated NAME=VALUE pairs (e.g. VAR1=val1;VAR2=val2)'
    default: ''
  github-token:
    description: 'GitHub token for downloading artifacts'
    required: true
  agent-app-name:
    description: 'New Relic application name to use in the test (only used when attach-agent is true)'
    default: 'dotnet-agent-perf-test'

runs:
  using: composite
  steps:
    - name: Mask license key in logs
      if: inputs.attach-agent == 'true' && inputs.license-key != ''
      shell: bash
      env:
        LICENSE_KEY: ${{ inputs.license-key }}
      run: echo "::add-mask::$LICENSE_KEY"

    - name: Create agent-home directory
      shell: bash
      run: mkdir -p "${{ github.workspace }}/${{ env.PERF_TEST_DIR }}/agent-home"

    # -------------------------------------------------------------------------
    # Agent download — github_release path: the published Linux tarball, as a
    # customer downloads it. A CI artifact would expire between releases.
    # -------------------------------------------------------------------------
    - name: Resolve the release version
      if: inputs.attach-agent == 'true' && inputs.agent-source == 'github_release'
      id: release-version
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REQUESTED_VERSION: ${{ inputs.agent-version }}
      run: |
        VERSION="${REQUESTED_VERSION#v}"
        if [ -z "$VERSION" ]; then
          echo "Looking up the latest release..."
          VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          VERSION="${VERSION#v}"
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Could not determine a release version (got '$VERSION')"
          exit 1
        fi
        echo "Release version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download the agent from the download site
      if: inputs.attach-agent == 'true' && inputs.agent-source == 'github_release'
      shell: bash
      env:
        AGENT_VERSION: ${{ steps.release-version.outputs.version }}
        DOWNLOAD_DIR: ${{ github.workspace }}/agent-download
      run: |
        FILE="newrelic-dotnet-agent_${AGENT_VERSION}_amd64.tar.gz"
        BASE="https://download.newrelic.com/dot_net_agent/previous_releases/${AGENT_VERSION}"
        mkdir -p "$DOWNLOAD_DIR"
        curl --fail --silent --show-error --location --retry 3 --output "$DOWNLOAD_DIR/$FILE" "$BASE/$FILE"
        ACTUAL=$(sha256sum "$DOWNLOAD_DIR/$FILE" | cut -d' ' -f1)

        # The expected hash comes from the release data in the repository (reviewed pull requests), not from the bucket.
        # A release whose data pull request is not merged yet falls back to the bucket's own SHA256 file.
        DATA="$GITHUB_WORKSPACE/release-data/download-site-hashes.json"
        EXPECTED=""
        if [ -f "$DATA" ]; then
          EXPECTED=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["versions"].get(sys.argv[2], {}).get("files", {}).get(sys.argv[3], ""))' "$DATA" "$AGENT_VERSION" "$FILE")
        fi
        if [ -z "$EXPECTED" ]; then
          echo "::warning::No release data for $FILE; checking against the SHA256 file next to it on the download site"
          EXPECTED=$(curl --fail --silent --show-error --location --retry 3 "$BASE/SHA256/$FILE.sha256" | awk '{ print tolower($1) }')
        fi
        if [ -z "$EXPECTED" ]; then
          echo "::error::No expected SHA-256 found for $FILE"
          exit 1
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::$FILE has SHA-256 $ACTUAL, expected $EXPECTED"
          exit 1
        fi
        echo "$FILE verified: $ACTUAL"

    - name: Extract the agent home from the release
      if: inputs.attach-agent == 'true' && inputs.agent-source == 'github_release'
      shell: bash
      env:
        AGENT_VERSION: ${{ steps.release-version.outputs.version }}
      run: |
        AGENT_HOME="${{ github.workspace }}/${{ env.PERF_TEST_DIR }}/agent-home"
        tar -xzf "${{ github.workspace }}/agent-download/newrelic-dotnet-agent_${AGENT_VERSION}_amd64.tar.gz" \
          --strip-components=1 -C "$AGENT_HOME"
        echo "Agent home contents:"
        ls "$AGENT_HOME"

    # -------------------------------------------------------------------------
    # Agent download — build_artifact path
    # -------------------------------------------------------------------------
    - name: Download agent from build artifact
      if: inputs.attach-agent == 'true' && inputs.agent-source == 'build_artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        github-token: ${{ inputs.github-token }}
        run-id: ${{ inputs.build-run-id }}
        name: homefolders
        path: ${{ github.workspace }}/agent-download
        repository: ${{ github.repository }}

    - name: Locate agent home from build artifact
      if: inputs.attach-agent == 'true' && inputs.agent-source == 'build_artifact'
      shell: bash
      run: |
        AGENT_HOME="${{ github.workspace }}/${{ env.PERF_TEST_DIR }}/agent-home"
        SOURCE=$(find "${{ github.workspace }}/agent-download" -name "newrelichome_x64_coreclr_linux" -type d | head -1)
        if [ -z "$SOURCE" ]; then
          echo "ERROR: Could not find newrelichome_x64_coreclr_linux in downloaded artifact"
          find "${{ github.workspace }}/agent-download" -type d | head -20
          exit 1
        fi
        echo "Copying agent from: $SOURCE"
        cp -r "$SOURCE/." "$AGENT_HOME/"
        echo "Agent home contents:"
        ls "$AGENT_HOME"

    # -------------------------------------------------------------------------
    # Run the performance test suite
    # -------------------------------------------------------------------------
    - name: Run performance tests
      shell: bash
      working-directory: ${{ env.PERF_TEST_DIR }}
      env:
        # run-perf-test.py reads these when --license-key / --collector-host are
        # absent, which keeps the key out of the script text and the command line.
        NEW_RELIC_LICENSE_KEY: ${{ inputs.license-key }}
        NEW_RELIC_HOST: ${{ inputs.collector-host }}
      run: |
        EXTRA_ENV_ARGS=()
        IFS=';' read -ra ENV_PAIRS <<< "${{ inputs.agent-env }}"
        for pair in "${ENV_PAIRS[@]}"; do
          [[ -z "$pair" ]] && continue
          echo "Adding extra environment variable: $pair"
          EXTRA_ENV_ARGS+=("--env" "$pair")
        done

        python3 run-perf-test.py \
          --attach-agent    "${{ inputs.attach-agent }}" \
          --agent-home      "${{ github.workspace }}/${{ env.PERF_TEST_DIR }}/agent-home" \
          --app-name        "${{ inputs.agent-app-name }}" \
          --test-duration   "${{ inputs.test-duration }}" \
          --locust-users    "${{ inputs.locust-users }}" \
          --locust-spawn-rate "${{ inputs.locust-spawn-rate }}" \
          --dotnet-version  "${{ inputs.dotnet-version }}" \
          --enabled-tasks   "${{ inputs.enabled-tasks }}" \
          "${EXTRA_ENV_ARGS[@]}"

    # -------------------------------------------------------------------------
    # Upload artifacts
    # -------------------------------------------------------------------------
    - name: Upload perf results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: perf-results-${{ inputs.run-label }}
        path: ${{ env.PERF_TEST_DIR }}/results/
        if-no-files-found: warn

    - name: Fix log file permissions
      if: always()
      shell: bash
      run: |
        sudo chown -R "$(id -u):$(id -g)" "${{ env.PERF_TEST_DIR }}/logs" || true
        sudo chmod -R a+rX "${{ env.PERF_TEST_DIR }}/logs" || true

    - name: Upload perf logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: perf-logs-${{ inputs.run-label }}
        path: ${{ env.PERF_TEST_DIR }}/logs/
        if-no-files-found: warn
