name: Release Build

# Builds the signed, deployable agent artifacts. This is the only workflow that holds the code
# signing certificate and the RPM GPG key: both live in the protected "release" environment,
# which accepts only main and v* tags and requires a second team member's approval.
# deploy_agent.yml deploys the "deploy-artifacts" of a successful run of this workflow.
# all_solutions.yml builds the same packages unsigned on every PR, through the same actions.
# The run-artifactbuilder job also attests the download-site files (build provenance).
on:
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build-fullagent-msi:
    name: Build FullAgent and signed MSIInstaller
    # Agent releases only: the Azure Site Extension release (AzureSiteExtension_v*) is built by siteextension_release.yml.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    # VS 2026 MSBuild: build-msi runs MSBuild.exe with the pinned .NET 11 SDK selected by the
    # CI root global.json, and that SDK needs MSBuild 18.7 or later (VS 2022 has 17.14).
    runs-on: windows-2025-vs2026
    environment: release
    permissions:
      contents: read

    outputs:
      agentVersion: ${{ steps.build-agent.outputs.agent-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Build agent
        id: build-agent
        uses: ./.github/actions/build-agent

      # Imported in-process so the passphrase never reaches a command line. The PFX lives in
      # RUNNER_TEMP only for the import; signtool /a then picks the cert from CurrentUser\My.
      - name: Install Code Signing Certificate
        id: install_cert
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          CERT_PASSPHRASE: ${{ secrets.CERT_PASSPHRASE }}
        run: |
          $filePath = Join-Path $env:RUNNER_TEMP 'newrelic_code_sign_cert.pfx'
          try {
            [IO.File]::WriteAllBytes($filePath, [Convert]::FromBase64String($env:SIGNING_CERT))
            $password = ConvertTo-SecureString $env:CERT_PASSPHRASE -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $filePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          }
          finally {
            Remove-Item $filePath -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Imported $(@($imported).Count) certificate(s) into Cert:\CurrentUser\My"
          echo "thumbprints=$((@($imported) | ForEach-Object Thumbprint) -join ',')" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Build MSI installers (signed)
        uses: ./.github/actions/build-msi
        with:
          sign: 'true'

      - name: Remove Code Signing Certificate
        if: always() && steps.install_cert.outputs.thumbprints != ''
        env:
          THUMBPRINTS: ${{ steps.install_cert.outputs.thumbprints }}
        run: |
          foreach ($thumbprint in $env:THUMBPRINTS -split ',') {
            Remove-Item -Path "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -ErrorAction SilentlyContinue
          }
        shell: powershell

  create-package-rpm:
    needs: build-fullagent-msi
    name: Create signed RPM Package
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outside the workspace; build/Linux/docker-compose.yml mounts GPG_KEYS_DIR read-only at /keys.
      - name: Write GPG Private Key
        env:
          NEW_GPG_KEY: ${{ secrets.NEW_GPG_KEY }}
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/gpg-keys"
          printf '%s' "$NEW_GPG_KEY" | base64 -d > "$RUNNER_TEMP/gpg-keys/private_gpg_key.gpg"
        shell: bash

      - name: Build RPM (signed)
        uses: ./.github/actions/build-linux-package
        with:
          package: rpm
          agent-version: ${{ needs.build-fullagent-msi.outputs.agentVersion }}
          gpg-keys-dir: ${{ runner.temp }}/gpg-keys
          gpg-key-passphrase: ${{ secrets.NEW_GPG_KEY_PASSPHRASE }}

      - name: Remove GPG Private Key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gpg-keys"
        shell: bash

  create-package-deb:
    needs: build-fullagent-msi
    name: Create Debian package
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Debian package
        uses: ./.github/actions/build-linux-package
        with:
          package: deb
          agent-version: ${{ needs.build-fullagent-msi.outputs.agentVersion }}

  run-artifactbuilder:
    needs: [create-package-rpm, create-package-deb]
    name: Run ArtifactBuilder
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Fails the run if either MSI is unsigned.
      - name: Run ArtifactBuilder
        uses: ./.github/actions/run-artifactbuilder
        with:
          verify-msi-signature: 'true'

      # Records which workflow, commit and run built each download-site file, signed with this job's
      # OIDC identity and logged publicly. Verify with: gh attestation verify <file> --repo newrelic/newrelic-dotnet-agent
      # The .nupkg files are left out: nuget.org adds its repository signature, so the served package
      # differs from what is built here.
      - name: Attest download-site artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/BuildArtifacts/DownloadSite/*.msi
            build/BuildArtifacts/DownloadSite/*.zip
            build/BuildArtifacts/DownloadSite/*.tar.gz
            build/BuildArtifacts/DownloadSite/*.deb
            build/BuildArtifacts/DownloadSite/*.rpm
