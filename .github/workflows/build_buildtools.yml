name: Build the Build Tools solution

on:
  pull_request:
    branches:
      - main
    paths:
      - 'build/**'
      - '.github/workflows/scripts/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
      runs-on: windows-latest
  
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ArtifactBuilder targets the pinned SDK's .NET version, so build with that SDK.
      - name: Install pinned .NET SDK
        uses: ./.github/actions/setup-pinned-dotnet

      - name: Build the solution
        run:  dotnet build build/BuildTools.sln -c Release -m -p:Platform="Any CPU" --restore
