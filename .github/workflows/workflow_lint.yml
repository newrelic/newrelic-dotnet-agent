name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/**'

permissions: {}

jobs:
  check-workflows:
    name: Check Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --require-hashes -r .github/scripts/pyyaml_requirements.txt
        shell: bash

      - name: Run workflow checks
        run: python3 .github/scripts/check-workflows.py
        shell: bash
