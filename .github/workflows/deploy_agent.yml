name: Deploy the .NET Agent

on:
  workflow_dispatch:
    inputs:
      get-version-automatically:
        description: 'Automatically determine the Agent Version and Run ID'
        type: boolean
        required: true
        default: true
      agent_version:
       description: 'OVERRIDE: Agent Version to deploy. Format: X.X.X - ignored unless "Automatically determine..." is unchecked'
       required: false
      run_id:
         description: 'OVERRIDE: Run ID of a successful release_build.yml run (any other run is rejected).  ID can be found in URL for run. Ignored unless "Automatically determine..." is unchecked'
         required: false
      deploy:
        type: boolean
        description: Deploy Build Artifacts. (If not selected, do everything except deploy.)
        required: true
        default: true
      downloadsite:
        type: boolean
        description: Deploy MSI / ZIP / Tarball to the Download Site
        required: true
        default: true
      nuget:
        type: boolean
        description: Deploy Nuget Packages
        required: true
        default: true
      linux:
        type: boolean
        description: Deploy APT / YUM Packages
        required: true
        default: true
      linux-deploy-to-production:
        type: boolean
        description: Deploy APT / YUM Packages to Production Repository. (If not selected, will deploy to a test respository.)
        required: true
        default: true
      linux-deploy-yum-repo-definitions:
        type: boolean
        description: Deploy YUM repository definitions to the targeted repository (production or test, based on the 'linux-deploy-to-production' input).
        required: true
        default: false
      indexdownloadsite:
        type: boolean
        description: Re-Index the Download Site S3 container
        required: true
        default: true

# Every job that holds a production credential runs in the protected "release" environment
# (main and v* tags only; a second team member must approve). id-token: write is granted only
# to the jobs that exchange an OIDC token.
permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true

jobs:
  get-release-info:
    name: Get Release Version and Run ID
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.step2.outputs.release_version }}
      workflow_run_id: ${{ steps.step2.outputs.workflow_run_id }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        if: ${{ inputs.get-version-automatically }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Get Release Version and Run ID
        if: ${{ inputs.get-version-automatically }}
        id: step1
        run: |
          # Get the commit sha for the most recent release
          COMMIT_SHA=$(git rev-list -n 1 "$(gh release list --limit 1 | awk '{ print $1 }')")
          if [[ -z "$COMMIT_SHA" ]]; then
            echo "::error::Unable to find SHA of most recent release"
            exit 1
          fi
          echo "Found commit sha: $COMMIT_SHA"

          # get info on the most recent release, writing output to a json file
          gh release view --json name,isDraft,isPrerelease,publishedAt > release.json

          # Get the version id of the most recent release (reported as "v99.99.99" so we strip off the "v")
          RELEASE_VERSION=$(cat release.json | jq --raw-output ".name | .[1:]")
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "::error::Could not find the latest release."
            exit 1
          fi
          echo "Found release version: $RELEASE_VERSION"

          if [ "$(cat release.json | jq --raw-output '.isDraft')" = "true" ]; then
            echo "::error::$RELEASE_VERSION is marked as 'Draft'. Use manual overrides to continue."
            exit 1
          fi
          if [ "$(cat release.json | jq --raw-output '.isPrerelease')" = "true" ]; then
            echo "::error::$RELEASE_VERSION is marked as 'Pre-Release'. Use manual overrides to continue."
            exit 1
          fi
          # check release date - should be within the last 7 days (to ensure we don't grab an old release)
          PUBLISHED_AT=$(cat release.json | jq --raw-output '.publishedAt')
          if [[ -z "$PUBLISHED_AT" ]]; then
            echo "::error::Release publish date is empty. Use manual overrides to continue."
            exit 1
          fi
          LAST_WEEK=$(date --date "-7days" -u +"%s")
          PUBLISH_DATE=$(date --date "$PUBLISHED_AT" -u +"%s")
          if [ $LAST_WEEK -ge $PUBLISH_DATE ]; then
            echo "::error::$RELEASE_VERSION was published more than a week ago. Use manual overrides to continue."
            exit 1
          fi

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          # The full test suite runs in all_solutions on the release event; require it to have passed.
          TEST_RUN_ID=$(gh run list --commit $COMMIT_SHA --workflow all_solutions.yml --event release --status success --limit 1 --json databaseId --jq ".[0] | .databaseId")
          if [[ -z "$TEST_RUN_ID" ]]; then
            echo "::error::Could not find a successful all_solutions workflow run for the Release event against commit SHA $COMMIT_SHA. Use manual overrides to continue."
            exit 1
          fi
          echo "Found passing test run id: $TEST_RUN_ID"

          # The signed artifacts come from the release_build workflow run for the same release event and commit.
          WORKFLOW_RUN_ID=$(gh run list --commit $COMMIT_SHA --workflow release_build.yml --event release --status success --limit 1 --json databaseId --jq ".[0] | .databaseId")
          if [[ -z "$WORKFLOW_RUN_ID" ]]; then
            echo "::error::Could not find a successful release_build workflow run for the Release event against commit SHA $COMMIT_SHA. Use manual overrides to continue."
            exit 1
          fi

          echo "Found workflow run id: $WORKFLOW_RUN_ID"
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Set Output Release Version and Build Run ID
        id: step2
        env:
          GET_VERSION_AUTOMATICALLY: ${{ inputs.get-version-automatically }}
          DETECTED_RELEASE_VERSION: ${{ steps.step1.outputs.release_version }}
          DETECTED_WORKFLOW_RUN_ID: ${{ steps.step1.outputs.workflow_run_id }}
          OVERRIDE_AGENT_VERSION: ${{ inputs.agent_version }}
          OVERRIDE_RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$GET_VERSION_AUTOMATICALLY" = "true" ]; then
            RELEASE_VERSION="$DETECTED_RELEASE_VERSION"
            WORKFLOW_RUN_ID="$DETECTED_WORKFLOW_RUN_ID"
          else
            if [[ -z "$OVERRIDE_AGENT_VERSION" ]]; then
              echo "::error::Agent Version not specified."
              exit 1
            fi
            if [[ -z "$OVERRIDE_RUN_ID" ]]; then
              echo "::error::Run ID not specified."
              exit 1
            fi
            RELEASE_VERSION="$OVERRIDE_AGENT_VERSION"
            WORKFLOW_RUN_ID="$OVERRIDE_RUN_ID"
          fi

          # Every later job uses these two values, so only well-formed ones may leave this job.
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Agent version must look like '10.0.0'."
            exit 1
          fi
          if [[ ! "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Run ID must be numeric."
            exit 1
          fi

          # Only signed release_build output may be deployed; all_solutions builds the same packages unsigned.
          RUN_INFO=$(gh api "repos/$REPO/actions/runs/$WORKFLOW_RUN_ID" --jq '[.path, .conclusion] | @tsv')
          read -r RUN_PATH RUN_CONCLUSION <<< "$RUN_INFO"
          if [ "${RUN_PATH%@*}" != ".github/workflows/release_build.yml" ]; then
            echo "::error::Run $WORKFLOW_RUN_ID is not a release_build.yml run (it is '$RUN_PATH')."
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::release_build.yml run $WORKFLOW_RUN_ID did not succeed (conclusion '$RUN_CONCLUSION')."
            exit 1
          fi
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-external-artifacts:
    name: Get and Publish Deploy Artifacts Locally
    needs: get-release-info
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download Deploy Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.get-release-info.outputs.workflow_run_id }}
          name: deploy-artifacts
          path: ${{ github.workspace }}
          repository: ${{ github.repository }}

      - name: Upload Deploy Artifacts Locally
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-artifacts
          path: ${{ github.workspace }}
          if-no-files-found: error

  deploy-downloadsite:
    needs: [get-release-info, get-external-artifacts]
    if: ${{ inputs.downloadsite }}
    name: Deploy MSI to Download Site
    runs-on: windows-2022
    environment: release

    steps:
      - name: Download Deploy Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-artifacts
          path: ${{ github.workspace }}\staging_dir

      - name: Move Artifacts to working_dir
        run: |
          Copy-Item -Path .\staging_dir\DownloadSite -Destination .\working_dir -Recurse
        shell: powershell

      - name: Create Version-less Installers
        run: |
          Copy-Item .\working_dir\NewRelicDotNetAgent_*_x64.msi .\working_dir\NewRelicDotNetAgent_x64.msi -Force -Recurse
          Copy-Item .\working_dir\NewRelicDotNetAgent_*_x86.msi .\working_dir\NewRelicDotNetAgent_x86.msi -Force -Recurse
          Copy-Item .\working_dir\NewRelicDotNetAgent_*_x64.zip .\working_dir\NewRelicDotNetAgent_x64.zip -Force -Recurse
          Copy-Item .\working_dir\NewRelicDotNetAgent_*_x86.zip .\working_dir\NewRelicDotNetAgent_x86.zip -Force -Recurse
          Copy-Item .\working_dir\newrelic-dotnet-agent_*_amd64.tar.gz .\working_dir\newrelic-dotnet-agent_amd64.tar.gz -Force -Recurse
          Copy-Item .\working_dir\newrelic-dotnet-agent_*_arm64.tar.gz .\working_dir\newrelic-dotnet-agent_arm64.tar.gz -Force -Recurse
        shell: powershell

      - name: Deploy latest_release to Download Site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          New-Item -ItemType directory -Path .\latest_release -Force
          Copy-Item .\working_dir\* .\latest_release\ -Force -Recurse
          cd .\latest_release
          if ($env:DEPLOY -eq "true") {
            aws s3 sync . "$env:BUCKET_NAME/dot_net_agent/latest_release/" --include "*" --exclude ".DS_Store" --delete
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "aws s3 sync . <BUCKET_NAME>/dot_net_agent/latest_release/ --include `"*`" --exclude `".DS_Store`" --delete"
          }
        shell: pwsh

      - name: Deploy previous_release to Download Site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DEPLOY: ${{ inputs.deploy }}
          RELEASE_VERSION: ${{ needs.get-release-info.outputs.release_version }}
        run: |
          New-Item -ItemType directory -Path ".\previous_releases\$env:RELEASE_VERSION" -Force
          Copy-Item .\working_dir\* ".\previous_releases\$env:RELEASE_VERSION\" -Force -Recurse
          cd ".\previous_releases\$env:RELEASE_VERSION"
          if ($env:DEPLOY -eq "true") {
            aws s3 sync . "$env:BUCKET_NAME/dot_net_agent/previous_releases/$env:RELEASE_VERSION/" --include "*" --exclude ".DS_Store" --delete
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "aws s3 sync . <BUCKET_NAME>/dot_net_agent/previous_releases/$env:RELEASE_VERSION/ --include `"*`" --exclude `".DS_Store`" --delete"
          }
        shell: pwsh

  index-download-site:
    needs: deploy-downloadsite
    name: Rebuild indexes on the download site
    if: ${{ inputs.indexdownloadsite }}
    uses: ./.github/workflows/build_download_site_index_files.yml
    strategy:
      matrix:
        prefix: ["dot_net_agent/latest_release", "dot_net_agent/previous_releases"]
    with:
      prefix: ${{ matrix.prefix }}
      aws-region: "us-east-1"
      dry-run: false
    # No secrets passed: the called job reads the bucket credentials from the "release" environment.

  deploy-nuget:
    needs: get-external-artifacts
    if: ${{ inputs.nuget }}
    name: Deploy Agent to NuGet
    runs-on: windows-2022
    environment: release
    permissions:
      id-token: write #enable GitHub OIDC token issuance for this job

    env:
      nuget_source: https://www.nuget.org

    steps:
      - name: Download Deploy Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-artifacts
          path: ${{ github.workspace }}\working_dir

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_TRUSTED_PUBLISH_POLICY_USER }}

      - name: Deploy Agent to Nuget
        env:
          DEPLOY: ${{ inputs.deploy }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageName = Get-ChildItem ${{ github.workspace }}\working_dir\NugetAgent\NewRelic.Agent.*.nupkg -Name
          $packagePath = Convert-Path ${{ github.workspace }}\working_dir\NugetAgent\$packageName
          $version = $packageName.TrimStart('NewRelic.Agent').TrimStart('.').TrimEnd('.nupkg')
          if ($env:DEPLOY -eq "true") {
            dotnet nuget push $packagePath --api-key "$env:NUGET_API_KEY" --source ${{ env.nuget_source }}
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "dotnet nuget push $packagePath --source ${{ env.nuget_source }}"
          }
        shell: powershell

      - name: Deploy Agent API to Nuget
        env:
          DEPLOY: ${{ inputs.deploy }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageName = Get-ChildItem ${{ github.workspace }}\working_dir\NugetAgentApi\NewRelic.Agent.Api.*.nupkg -Name
          $packagePath = Convert-Path ${{ github.workspace }}\working_dir\NugetAgentApi\$packageName
          $version = $packageName.TrimStart('NewRelic.Agent.Api').TrimStart('.').TrimEnd('.nupkg')
          if ($env:DEPLOY -eq "true") {
            dotnet nuget push $packagePath --api-key "$env:NUGET_API_KEY" --source ${{ env.nuget_source }}
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "dotnet nuget push $packagePath --source ${{ env.nuget_source }}"
          }
        shell: powershell

      - name: Deploy Azure Cloud Services to Nuget
        env:
          DEPLOY: ${{ inputs.deploy }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageName = Get-ChildItem ${{ github.workspace }}\working_dir\NugetAzureCloudServices\NewRelicWindowsAzure.*.nupkg -Name
          $packagePath = Convert-Path ${{ github.workspace }}\working_dir\NugetAzureCloudServices\$packageName
          $version = $packageName.TrimStart('NewRelicWindowsAzure').TrimStart('.').TrimEnd('.nupkg')
          if ($env:DEPLOY -eq "true") {
            dotnet nuget push $packagePath --api-key "$env:NUGET_API_KEY" --source ${{ env.nuget_source }}
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "dotnet nuget push $packagePath --source ${{ env.nuget_source }}"
          }
        shell: powershell

      - name: Deploy Azure WebSites-x64 to Nuget
        env:
          DEPLOY: ${{ inputs.deploy }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageName = Get-ChildItem ${{ github.workspace }}\working_dir\NugetAzureWebSites-x64\NewRelic.Azure.WebSites.*.nupkg -Name
          $packagePath = Convert-Path ${{ github.workspace }}\working_dir\NugetAzureWebSites-x64\$packageName
          $version = $packageName.TrimStart('NewRelic.Azure.WebSites.x').TrimStart('.').TrimEnd('.nupkg')
          if ($env:DEPLOY -eq "true") {
            dotnet nuget push $packagePath --api-key "$env:NUGET_API_KEY" --source ${{ env.nuget_source }}
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "dotnet nuget push $packagePath --source ${{ env.nuget_source }}"
          }
        shell: powershell

      - name: Deploy Azure WebSites-x86 to Nuget
        env:
          DEPLOY: ${{ inputs.deploy }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageName = Get-ChildItem ${{ github.workspace }}\working_dir\NugetAzureWebSites-x86\NewRelic.Azure.WebSites.*.nupkg -Name
          $packagePath = Convert-Path ${{ github.workspace }}\working_dir\NugetAzureWebSites-x86\$packageName
          $version = $packageName.TrimStart('NewRelic.Azure.WebSites.x').TrimStart('.').TrimEnd('.nupkg')
          if ($env:DEPLOY -eq "true") {
            dotnet nuget push $packagePath --api-key "$env:NUGET_API_KEY" --source ${{ env.nuget_source }}
          }
          else {
            Write-Host "Input:deploy was not true.  The following deploy command was not run:"
            Write-Host "dotnet nuget push $packagePath --source ${{ env.nuget_source }}"
          }
        shell: powershell

  deploy-linux:
    needs: [get-release-info, get-external-artifacts]
    if: ${{ inputs.linux }}
    name: Deploy Linux to APT and YUM
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: read
      id-token: write # the test-repository deploy assumes an AWS role
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Install dos2unix
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dos2unix
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Deploy Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-artifacts
          path: ${{ github.workspace }}/

      # Outside the workspace and the image build context; deploy/linux/docker-compose.yml
      # mounts GPG_KEYS_DIR read-only at /keys, so the keys never become part of the image.
      - name: Write GPG Keys
        env:
          OLD_GPG_KEY: ${{ secrets.OLD_GPG_KEY }}
          NEW_GPG_KEY: ${{ secrets.NEW_GPG_KEY }}
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/gpg-keys"
          printf '%s' "$OLD_GPG_KEY" | base64 -d > "$RUNNER_TEMP/gpg-keys/old-private-key.gpg"
          printf '%s' "$NEW_GPG_KEY" | base64 -d > "$RUNNER_TEMP/gpg-keys/new-private-key.gpg"
        shell: bash

      - name: Move Artifacts to Staging Location
        run: |
          cp LinuxRpm/*.rpm ${{ github.workspace }}/deploy/linux/packages
          cp LinuxDeb/*.deb ${{ github.workspace }}/deploy/linux/packages
        shell: bash

      # Test repository only.  Production keeps its static keys because we cannot
      # create a role in the account that owns the production bucket.
      - name: Configure AWS credentials for the test repository
        if: ${{ !inputs.linux-deploy-to-production }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_REPO_DEPLOY_ROLE_ARN }}
          # A full repo rebuild signs and re-syncs every index, so this needs far
          # longer than the 900s used by the test workflows.
          role-duration-seconds: 3600
          aws-region: us-west-2

      # deploy/linux/docker-compose.yml passes every value below to the container by name,
      # so nothing is written to disk or placed on a command line.
      - name: Build and Run Container
        env:
          AGENT_VERSION: ${{ needs.get-release-info.outputs.release_version }}
          ACTION: release
          DEPLOY: ${{ inputs.deploy }}
          DEPLOY_TO_PRODUCTION: ${{ inputs.linux-deploy-to-production }}
          # Distinct names: the test-repo branch reads AWS_* exported by the role assumption above.
          PROD_MAIN_S3: ${{ secrets.PROD_MAIN_S3 }}
          LINUX_AWS_ACCESS_KEY_ID: ${{ secrets.LINUX_AWS_ACCESS_KEY_ID }}
          LINUX_AWS_SECRET_ACCESS_KEY: ${{ secrets.LINUX_AWS_SECRET_ACCESS_KEY }}
          TEST_S3_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
          NEW_PRIVATE_KEY_PASSPHRASE: ${{ secrets.NEW_GPG_KEY_PASSPHRASE }}
          OLD_KEY_ID: ${{ secrets.OLD_GPG_KEY_ID }}
          NEW_KEY_ID: ${{ secrets.NEW_GPG_KEY_ID }}
        run: |
          # get-release-info already validates this; checked again because a malformed version here
          # would publish to the wrong repository path.
          if [[ ! "$AGENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ; then
            echo "::error::Supplied agent version from Workflow ($AGENT_VERSION) is malformed.  It needs to be like '10.0.0'."
            exit 1
          fi

          if [ "$DEPLOY_TO_PRODUCTION" == "true" ] ; then
            # We're actually deploying to production (apt.newrelic.com and yum.newrelic.com)
            export S3_BUCKET="$PROD_MAIN_S3"
            export AWS_ACCESS_KEY_ID="$LINUX_AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$LINUX_AWS_SECRET_ACCESS_KEY"
            # Static keys only: a stray session token would invalidate them.
            unset AWS_SESSION_TOKEN
          else
            # Deploy to the test bucket that mirrors apt/yum.newrelic.com, using the
            # short-lived credentials exported by the role assumption above.  The session
            # token is required: an assumed role is three values, not two.
            if [ -z "$AWS_SESSION_TOKEN" ] ; then
              echo "::error::AWS_SESSION_TOKEN is empty - role assumption did not run or failed."
              exit 1
            fi
            export S3_BUCKET="$TEST_S3_BUCKET"
          fi
          export GPG_KEYS_DIR="$RUNNER_TEMP/gpg-keys"

          cd ${{ github.workspace }}/deploy/linux/
          find . -name "*.bash" |xargs chmod a+x
          find . -type f |xargs dos2unix
          docker compose build
          if [ "$DEPLOY" == "true" ] ; then
            docker compose run deploy_packages
          else
            echo "Input:deploy was not true.  The following deploy command was not run:"
            echo "docker compose run deploy_packages"
          fi
        shell: bash

      - name: Deploy YUM Repo Definitions
        continue-on-error: true
        if: ${{ inputs.deploy && inputs.linux-deploy-yum-repo-definitions }}
        # Deploy YUM repository definitions to the targeted repository (production or test, based on the 'linux-deploy-to-production' input).
        # The definitions are .repo files in ./build/Linux/yum directory at the root of the agent source tree.
        # The files just have to be copied to the <TARGET_S3_BUCKET>/dot_net_agent/yum directory, potentially overriding existing files.
        env:
          # Distinct names: the test-repo branch reads AWS_* exported by the role assumption above.
          LINUX_AWS_ACCESS_KEY_ID: ${{ secrets.LINUX_AWS_ACCESS_KEY_ID }}
          LINUX_AWS_SECRET_ACCESS_KEY: ${{ secrets.LINUX_AWS_SECRET_ACCESS_KEY }}
          PROD_MAIN_S3: ${{ secrets.PROD_MAIN_S3 }}
          TEST_S3_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
          DEPLOY_TO_PRODUCTION: ${{ inputs.linux-deploy-to-production }}
        run: |
          if [ "$DEPLOY_TO_PRODUCTION" == "true" ] ; then
            export AWS_ACCESS_KEY_ID="$LINUX_AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$LINUX_AWS_SECRET_ACCESS_KEY"
            TARGET_S3_BUCKET="$PROD_MAIN_S3"
          else
            # Test repository - the short-lived credentials from the role assumed
            # earlier in this job (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN)
            # are already present in the job environment.
            if [ -z "$AWS_SESSION_TOKEN" ] ; then
              echo "::error::AWS_SESSION_TOKEN is empty - role assumption did not run or failed."
              exit 1
            fi
            TARGET_S3_BUCKET="$TEST_S3_BUCKET"
          fi

          YUM_DIR="${{ github.workspace }}/build/Linux/yum"
          aws s3 cp "$YUM_DIR/newrelic-dotnet-agent.repo" "$TARGET_S3_BUCKET/dot_net_agent/yum/newrelic-dotnet-agent.repo"
          aws s3 cp "$YUM_DIR/newrelic-dotnet-agent-legacy.repo" "$TARGET_S3_BUCKET/dot_net_agent/yum/newrelic-dotnet-agent-legacy.repo"
        shell: bash

      - name: Clear Fastly cache
        continue-on-error: true
        if: ${{ inputs.deploy && inputs.linux-deploy-to-production && success() }}
        env:
          FASTLY_TOKEN: ${{ secrets.FASTLY_TOKEN }}
          FASTLY_URL: ${{ secrets.FASTLY_URL }}
        run: |
          # curl reads the URL and header from stdin, so neither appears on its command line.
          printf 'url = "%s"\nheader = "Fastly-Key: %s"\n' "$FASTLY_URL" "$FASTLY_TOKEN" \
            | curl -i -X POST --config -
        shell: bash

      - name: Clear Cloudflare cache
        continue-on-error: true
        if: ${{ inputs.deploy && inputs.linux-deploy-to-production && success() }}
        env:
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
        run: |
          # curl reads the URL and auth header from stdin, so neither appears on its command line.
          printf 'url = "%s"\nheader = "Authorization: Bearer %s"\n' "$CLOUDFLARE_CACHE_URL" "$CLOUDFLARE_CACHE_TOKEN" \
            | curl --config - -H 'Content-Type: application/json' -d '{"purge_everything": true}'
        shell: bash

      - name: Remove GPG Keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/gpg-keys"
        shell: bash

  publish-release-notes:
    needs: [get-release-info, deploy-linux, deploy-nuget, index-download-site]
    if: ${{ inputs.deploy && inputs.downloadsite && inputs.nuget && inputs.linux && inputs.linux-deploy-to-production }}
    name: Create and Publish Release Notes
    uses: newrelic/newrelic-dotnet-agent/.github/workflows/publish_release_notes.yml@main
    with:
      agent_version: ${{ needs.get-release-info.outputs.release_version }}
      run_id: ${{ needs.get-release-info.outputs.workflow_run_id }}
    # No secrets passed: the called job reads them from the "release" environment.

  post-deploy:
    permissions:
      issues: write
      contents: read
      packages: read
    needs: [get-release-info, deploy-linux, deploy-nuget, index-download-site]
    if: ${{ inputs.deploy && inputs.downloadsite && inputs.nuget && inputs.linux && inputs.linux-deploy-to-production }}
    name: Run Post Deploy Workflow
    uses: newrelic/newrelic-dotnet-agent/.github/workflows/post_deploy_agent.yml@main
    with:
      agent_version: ${{ needs.get-release-info.outputs.release_version }}
      wait_for_apt_and_yum: true
    # No secrets passed: the called jobs read them from the "release" environment.

  agent-metadata:
      permissions:
          contents: read
      needs: [get-release-info, deploy-linux, deploy-nuget, index-download-site]
      if: ${{ inputs.deploy && inputs.downloadsite && inputs.nuget && inputs.linux && inputs.linux-deploy-to-production }}
      name: Run Agent Metadata Workflow
      uses: newrelic/newrelic-dotnet-agent/.github/workflows/agent_metadata.yml@main
      with:
          version: v${{ needs.get-release-info.outputs.release_version }}
      # Repo- and org-level, not in the "release" environment: environment secrets cannot pass through
      # workflow_call, and agent_metadata.yml's job calls a workflow in another repository.
      secrets:
          FC_SYS_ID_CLIENT_ID: ${{ secrets.FC_SYS_ID_CLIENT_ID }}
          FC_SYS_ID_PR_KEY: ${{ secrets.FC_SYS_ID_PR_KEY }}
          AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
