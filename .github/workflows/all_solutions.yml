name: All Solutions Build

on:
  pull_request:
    branches:
      - main
      - "feature/**"

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      aggregate_payload_data:
        description: 'Collect and aggregate payload data'
        required: false
        type: boolean
        default: false
      parallelize_integration_tests:
        description: 'Enable parallel integration test execution (requires pre-built test apps)'
        required: false
        type: boolean
        default: true

  schedule:
    - cron: "0 9 * * 1-5"

# only allow one instance of this workflow to be running per PR or branch, cancels any that are already running
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  scripts_path: ${{ github.workspace }}\build\scripts
  tools_path: ${{ github.workspace }}\build\Tools
  DOTNET_NOLOGO: true

  # Dependabot Full CI Dispatch relaunches this workflow via workflow_dispatch against a
  # dependabot/* branch. Those runs need the build and the test suites, not a signed MSI or
  # signed Linux packages, so everything that touches signing material is skipped for them --
  # keeping the signing cert and GPG key off a runner that just executed build logic from a
  # package version nobody has reviewed. Steps gate on `env.skip_signing != 'true'`; the
  # packaging jobs gate on build-fullagent-msi's skipSigning output, since job-level `if`
  # cannot see `env`. Never true for a pull_request run: ref_name is <pr>/merge there.
  skip_signing: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'dependabot/') }}

jobs:
  check-modified-files:
    name: Check if source files were modified, skip remaining jobs if not
    # skip if the PR source branch starts with "release-please"
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please')
    uses: ./.github/workflows/check_modified_files.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read

  shellcheck:
    name: Validate shell scripts
    needs: check-modified-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Shellcheck
        run: |
          find ${{ github.workspace }} -name "*.sh" -exec shellcheck --severity=error {} +

  # This builds both FullAgent and MSIInstaller since MSIInstaller requires FullAgent artifacts.
  build-fullagent-msi:
    name: Build FullAgent and MSIInstaller
    runs-on: windows-2022
    permissions:
      contents: read
    needs:
      - check-modified-files
      - shellcheck
    # don't run this job if triggered by Dependabot, will cause all other jobs to be skipped as well.
    # workflow_dispatch is exempt from the Dependabot exclusion: Dependabot Full CI Dispatch
    # relaunches this workflow via workflow_dispatch against a Dependabot branch, and that run is
    # not a Dependabot event, so it has full access to secrets and must not be skipped.
    # run this job if source files were modified, or if triggered by a release, a manual execution or schedule
    if: (github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]') && (needs.check-modified-files.outputs.source-files-changed == 'true' || github.event.release || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')

    env:
      msi_solution_path: ${{ github.workspace }}\src\Agent\MsiInstaller\MsiInstaller.sln

    outputs:
      agentVersion: ${{ steps.build-agent.outputs.agent-version }}
      # Re-exported so the packaging jobs can gate on it: job-level `if` cannot read `env`.
      skipSigning: ${{ env.skip_signing }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Build agent
        id: build-agent
        uses: ./.github/actions/build-agent

      # Signing and MSI build are skipped for the Dependabot dispatch (see note above the jobs).
      # The build and homefolders artifact above are all the test suites need.
      - name: Convert Code Signing Certificate Into File
        id: write_cert
        if: env.skip_signing != 'true'
        run: |
          $filePath = '${{ github.workspace }}\newrelic_code_sign_cert.pfx'
          $bytes = [Convert]::FromBase64String('${{ secrets.SIGNING_CERT }}')
          [IO.File]::WriteAllBytes($filePath, $bytes)
          echo "filePath=$filePath" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Install Code Signing Certificate
        if: env.skip_signing != 'true'
        run: |
          Write-Host "certutil.exe -f -user -p <passphrase> -importPFX ${{ steps.write_cert.outputs.filePath }} NoRoot"
          certutil.exe -f -user -p ${{ secrets.CERT_PASSPHRASE }} -importPFX ${{ steps.write_cert.outputs.filePath }} NoRoot
        shell: powershell


      - name: Add msbuild to PATH (required for MsiInstaller build)
        if: env.skip_signing != 'true'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build MsiInstaller.sln x86
        if: env.skip_signing != 'true'
        run: |
          Write-Host "MSBuild.exe -restore -m -p:Configuration=Release -p:AllowUnsafeBlocks=true -p:Platform=x86 ${{ env.msi_solution_path }}"
          MSBuild.exe -restore -m -p:Configuration=Release -p:AllowUnsafeBlocks=true -p:Platform=x86 ${{ env.msi_solution_path }}
        shell: powershell

      - name: Build MsiInstaller.sln x64
        if: env.skip_signing != 'true'
        run: |
          Write-Host "MSBuild.exe -restore -m -p:Configuration=Release -p:AllowUnsafeBlocks=true -p:Platform=x64 ${{ env.msi_solution_path }}"
          MSBuild.exe -restore -m -p:Configuration=Release -p:AllowUnsafeBlocks=true -p:Platform=x64 ${{ env.msi_solution_path }}
        shell: powershell

      - name: Archive msi _build Artifacts
        if: env.skip_signing != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-build-folder-artifacts
          path: ${{ github.workspace }}\src\_build
          if-no-files-found: error

  run-linux-container-tests:
    name: Run Linux Container Tests
    needs:
      - build-fullagent-msi
    uses: ./.github/workflows/linux_container_tests.yml
    with:
      aggregate_payload_data: ${{ inputs.aggregate_payload_data == true || github.event_name == 'schedule' }}
      groups: ''
    secrets: inherit
    permissions:
      actions: write
      contents: read
        
  get-test-namespaces:
    name: Get Test Namespaces
    needs: check-modified-files
    if: (github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]') && (needs.check-modified-files.outputs.source-files-changed == 'true' || github.event.release || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    uses: ./.github/workflows/test_selection.yml
    permissions: {}
    with:
      mode: all

  run-integration-tests:
    name: Run IntegrationTests
    needs: [build-fullagent-msi, get-test-namespaces]
    uses: ./.github/workflows/integration_tests.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      namespaces: ${{ needs.get-test-namespaces.outputs.integration-windows-namespaces }}
      linux_namespaces: ${{ needs.get-test-namespaces.outputs.integration-linux-namespaces }}
      smoke_namespaces: ${{ needs.get-test-namespaces.outputs.integration-smoke-namespaces }}
      aggregate_payload_data: ${{ inputs.aggregate_payload_data == true || github.event_name == 'schedule' }}
      parallelize: ${{ inputs.parallelize_integration_tests == true || github.event_name != 'workflow_dispatch' }}

  run-unbounded-tests:
    name: Run Unbounded Tests
    needs: [build-fullagent-msi, get-test-namespaces]
    uses: ./.github/workflows/unbounded_tests.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      namespaces: ${{ needs.get-test-namespaces.outputs.unbounded-windows-namespaces }}
      linux_namespaces: ${{ needs.get-test-namespaces.outputs.unbounded-linux-namespaces }}
      smoke_namespaces: ${{ needs.get-test-namespaces.outputs.unbounded-smoke-namespaces }}
      aggregate_payload_data: ${{ inputs.aggregate_payload_data == true || github.event_name == 'schedule' }}

  create-package-rpm:
    needs: build-fullagent-msi
    name: Create RPM Package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # Skipped for the Dependabot dispatch: signs with NEW_GPG_KEY, and needs an MSI artifact
    # that run does not produce. Compared against 'false' so an unresolved output skips this
    # job rather than running it with the signing key.
    if: needs.build-fullagent-msi.outputs.skipSigning == 'false'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download msi _build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi-build-folder-artifacts
          path: src/_build

      - name: Download Agent Home Folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homefolders
          path: src/Agent

      - name: Convert GPG Private Key Into File
        id: write_gpgkey
        run: |
          filePath="/tmp/private_gpg_key.gpg"
          echo "${{ secrets.NEW_GPG_KEY }}" | base64 -d > $filePath
          echo "filePath=$filePath" >> $GITHUB_OUTPUT
        shell: bash

      - name: Copy GPG Key to keys
        run: |
          mkdir ${{ github.workspace }}/build/Linux/keys
          cp -f ${{ steps.write_gpgkey.outputs.filePath }} ${{ github.workspace }}/build/Linux/keys/private_gpg_key.gpg
        shell: bash

      - name: Build RPM
        run: |
          agentVersion=${{ needs.build-fullagent-msi.outputs.agentVersion }}

          if [[ "$agentVersion" =~ [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            major=$(echo $agentVersion | cut -d'.' -f1)
            minor=$(echo $agentVersion | cut -d'.' -f2)
            patch=$(echo $agentVersion | cut -d'.' -f3)
            agentVersion="${major}.${minor}.${patch}"
            echo "agentVersion is simplified to $agentVersion"
          fi

          cd ${{ github.workspace }}/build/Linux
          docker compose build build_rpm
          docker compose run -e AGENT_VERSION=$agentVersion -e GPG_KEY=/keys/private_gpg_key.gpg -e GPG_KEY_PASSPHRASE=${{ secrets.NEW_GPG_KEY_PASSPHRASE }} build_rpm
        shell: bash

      - name: Archive RPM Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-build-artifacts
          path: ${{ github.workspace }}/src/_build/CoreArtifacts
          if-no-files-found: error

  create-package-deb:
    needs: build-fullagent-msi
    name: Create Debian package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # Skipped for the Dependabot dispatch: signs with NEW_GPG_KEY, and needs an MSI artifact
    # that run does not produce. Compared against 'false' so an unresolved output skips this
    # job rather than running it with the signing key.
    if: needs.build-fullagent-msi.outputs.skipSigning == 'false'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Agent Home Folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homefolders
          path: src/Agent

      - name: Download msi _build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi-build-folder-artifacts
          path: src/_build

      - name: Build Debian Package
        run: |
          agentVersion=${{ needs.build-fullagent-msi.outputs.agentVersion }}

          if [[ "$agentVersion" =~ [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            major=$(echo $agentVersion | cut -d'.' -f1)
            minor=$(echo $agentVersion | cut -d'.' -f2)
            patch=$(echo $agentVersion | cut -d'.' -f3)
            agentVersion="${major}.${minor}.${patch}"
            echo "agentVersion is simplified to $agentVersion"
          fi

          cd ${{ github.workspace }}/build/Linux
          docker compose build build_deb
          docker compose run -e AGENT_VERSION=$agentVersion build_deb
        shell: bash

      - name: Archive Debian Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-build-artifacts
          path: ${{ github.workspace }}/src/_build/CoreArtifacts
          if-no-files-found: error

  run-artifactbuilder:
    needs: [create-package-rpm, create-package-deb]
    name: Run ArtifactBuilder
    runs-on: windows-2022
    permissions:
      contents: read
    # No explicit gate needed: both packaging jobs it needs are skipped for the Dependabot
    # dispatch, which skips this job with them.

    steps:
      - name: Install latest .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
  
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Download Agent Home Folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homefolders
          path: src/Agent

      - name: Download msi _build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi-build-folder-artifacts
          path: src/_build

      - name: Download Debian _build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-build-artifacts
          path: src/_build/CoreArtifacts

      - name: Download RPM _build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-build-artifacts
          path: src/_build/CoreArtifacts

      - name: Run ArtifactBuilder
        run: |
          ${{ github.workspace }}\build\package.ps1 -configuration Release -IncludeDownloadSite
        shell: powershell

      - name: Archive Deploy Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-artifacts
          path: |
            ${{ github.workspace }}\build\BuildArtifacts
          if-no-files-found: error

  # This job is necessary in order for us to have a branch protection rule for tests with a matrix
  # if any of the matrix tests fail, this job fails and the branch protection rule keeps the PR from merging
  integration-test-status:
    name: Check Test Matrix Status
    runs-on: ubuntu-latest
    permissions: {}
    needs: [run-linux-container-tests, run-integration-tests, run-unbounded-tests]
    if: always()
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Successful test run
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing test run
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

  aggregate-integration-payload-logs:
    name: Aggregate Integration Test Payload Logs
    needs: [integration-test-status]
    runs-on: ubuntu-latest
    if: inputs.aggregate_payload_data == true || github.event_name == 'schedule'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all integration payload artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-payload-bytes-*
          path: payload-logs/integration
          merge-multiple: true

      - name: Combine payload logs
        run: bash build/Scripts/combine-payload-logs.sh payload-logs/integration "Integration Tests" combined-logs/integration_payload_bytes_combined.json
        shell: bash

      - name: Upload combined integration payload log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-integration-payload-bytes
          path: combined-logs/integration_payload_bytes_*.json
          if-no-files-found: warn

      - name: Delete individual integration payload artifacts
        run: |
          # Get all artifacts from this run matching the pattern and delete them
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate \
            --jq '.artifacts[] | select(.name | startswith("integration-payload-bytes-")) | "\(.id) \(.name)"' \
            | while read -r artifact_id artifact_name; do
              echo "Deleting artifact: $artifact_name (ID: $artifact_id)"
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$artifact_id \
                && echo "Successfully deleted $artifact_name" \
                || echo "Failed to delete $artifact_name"
            done
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        continue-on-error: true

  aggregate-unbounded-payload-logs:
    name: Aggregate Unbounded Test Payload Logs
    needs: [integration-test-status]
    runs-on: ubuntu-latest
    if: inputs.aggregate_payload_data == true || github.event_name == 'schedule'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all unbounded payload artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unbounded-payload-bytes-*
          path: payload-logs/unbounded
          merge-multiple: true

      - name: Combine payload logs
        run: bash build/Scripts/combine-payload-logs.sh payload-logs/unbounded "Unbounded Integration Tests" combined-logs/unbounded_payload_bytes_combined.json
        shell: bash

      - name: Upload combined unbounded payload log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-unbounded-payload-bytes
          path: combined-logs/unbounded_payload_bytes_*.json
          if-no-files-found: warn

      - name: Delete individual unbounded payload artifacts
        run: |
          # Get all artifacts from this run matching the pattern and delete them
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate \
            --jq '.artifacts[] | select(.name | startswith("unbounded-payload-bytes-")) | "\(.id) \(.name)"' \
            | while read -r artifact_id artifact_name; do
              echo "Deleting artifact: $artifact_name (ID: $artifact_id)"
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$artifact_id \
                && echo "Successfully deleted $artifact_name" \
                || echo "Failed to delete $artifact_name"
            done
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        continue-on-error: true

  display-all-payload-summaries:
    name: Display All Payload Summaries
    needs: [aggregate-integration-payload-logs, aggregate-unbounded-payload-logs, run-linux-container-tests]
    runs-on: ubuntu-latest
    if: inputs.aggregate_payload_data == true || github.event_name == 'schedule'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download combined integration payload log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: combined-integration-payload-bytes
          path: payload-summaries
        continue-on-error: true

      - name: Download combined unbounded payload log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: combined-unbounded-payload-bytes
          path: payload-summaries
        continue-on-error: true

      - name: Download combined Linux container payload log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: combined-linux-container-payload-bytes
          path: payload-summaries
        continue-on-error: true

      - name: Create consolidated JSON output
        run: |
          if ls payload-summaries/*_combined.json >/dev/null 2>&1; then
            final="$(jq -n '{bytes:0, byType:{}, executedTests:0}')"
            for f in payload-summaries/*_combined.json; do
              base="$(basename "$f" _payload_bytes_combined.json)"
              case "$base" in
                integration)    key="integrationTests";;
                unbounded)      key="unboundedTests";;
                linux_container) key="containerTests";;
                *)              key="$base";;
              esac
              final="$(jq --arg key "$key" --slurpfile c "$f" '
                .[$key] = {generatedAt:$c[0].generatedAt, bytes:$c[0].grandTotalBytes, executedTests:($c[0].executedTests // 0), byType:$c[0].byType, details:$c[0].details}
                | .bytes += $c[0].grandTotalBytes
                | .executedTests += ($c[0].executedTests // 0)
                | .byType = (reduce ($c[0].byType|to_entries[]) as $cat (.byType; .[$cat.key]=((.[$cat.key]//0)+$cat.value)))
              ' <<<"$final")"
            done
            echo "$final" > final_payload_summary.json
          else
            echo '{"bytes": 0, "byType": {}, "executedTests": 0}' > final_payload_summary.json
          fi
          echo "FINAL CONSOLIDATED PAYLOAD SUMMARY"; cat final_payload_summary.json
        shell: bash

      - name: Upload final consolidated summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-payload-summary
          path: final_payload_summary.json
          if-no-files-found: warn

      - name: Guard against empty payload data
        if: inputs.aggregate_payload_data == true || github.event_name == 'schedule'
        run: bash build/Scripts/check-payload-not-empty.sh final_payload_summary.json
        shell: bash

      - name: Report payload metrics to New Relic (staging)
        if: inputs.aggregate_payload_data == true || github.event_name == 'schedule'
        continue-on-error: true
        env:
          PAYLOAD_SUMMARY_FILE: final_payload_summary.json
          NR_METRIC_API_URL: https://staging-metric-api.newrelic.com/metric/v1
          NR_CI_INGEST_KEY: ${{ secrets.NR_CI_INGEST_KEY }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash build/Scripts/report-payload-metrics.sh
        shell: bash

      - name: Delete combined payload artifacts
        run: |
          # Get combined artifacts from this run and delete them
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate \
            --jq '.artifacts[] | select(.name | startswith("combined-")) | select(.name | endswith("-payload-bytes")) | "\(.id) \(.name)"' \
            | while read -r artifact_id artifact_name; do
              echo "Deleting artifact: $artifact_name (ID: $artifact_id)"
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$artifact_id \
                && echo "Successfully deleted $artifact_name" \
                || echo "Failed to delete $artifact_name"
            done
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        continue-on-error: true

  # Posts the dispatched run's result back onto the Dependabot pull request as a
  # commit status and a pull request comment. 
  
  # This job deliberately checks nothing out. It holds statuses: write and
  # pull-requests: write, so unreviewed branch content must never execute here.
  report-dependabot-status:
    name: Report full CI result on the Dependabot pull request
    # Only the two leaf jobs are needed, to order this last; everything else is
    # transitively upstream. The result is read from the run's own job list rather
    # than needs.*.result, which cannot see an upstream failure: that leaves the
    # downstream jobs 'skipped', not 'failure'.
    needs: [shellcheck, integration-test-status]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'dependabot/nuget/')
    permissions:
      actions: read
      statuses: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Determine run result
        id: result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail

          # Every job in this run that has finished. This job itself is still in
          # progress, so it has a null conclusion and drops out here.
          all="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion != null) | .conclusion')"

          if [ -z "$all" ]; then
            echo "::error::Could not read job conclusions for run $RUN_ID"
            exit 1
          fi

          conclusions="$(sort -u <<<"$all")"
          echo "Job conclusions in this run: $(echo $conclusions | tr '\n' ' ')"

          # A cancelled job means this run was superseded: Dependabot force-pushes
          # to rebase its branches, and this workflow cancels in-progress runs for
          # the same ref. A replacement run is already on its way, so reporting
          # failure for this one would be wrong.
          if grep -qx cancelled <<<"$conclusions"; then
            echo "Run was cancelled (superseded); not reporting."
            echo "should-report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that is not a clean outcome is a failure. The packaging and
          # ArtifactBuilder jobs are skipped for Dependabot runs by design
          # (env.skip_signing), and skipped is a clean outcome.
          if grep -vqxE 'success|skipped|neutral' <<<"$conclusions"; then
            state=failure
          else
            state=success
          fi

          # Job tally for the comment, e.g. "100 success, 7 skipped".
          tally="$(sort <<<"$all" | uniq -c | sort -rn \
            | awk '{ printf "%s%s %s", sep, $1, $2; sep = ", " } END { print "" }')"

          echo "should-report=true" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "tally=$tally" >> "$GITHUB_OUTPUT"

      - name: Post commit status
        if: steps.result.outputs.should-report == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          STATE: ${{ steps.result.outputs.state }}
        run: |
          set -o pipefail
          echo "Reporting '$STATE' for $HEAD_SHA ($WORKFLOW_NAME)"
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="full-ci (dependabot) / $WORKFLOW_NAME" \
            -f target_url="$RUN_URL" \
            -f description="$WORKFLOW_NAME: $STATE"

      - name: Comment on the Dependabot pull request
        if: steps.result.outputs.should-report == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          STATE: ${{ steps.result.outputs.state }}
          TALLY: ${{ steps.result.outputs.tally }}
        run: |
          set -o pipefail

          # A dispatched run has no pull request context, so resolve the pull
          # request from the head SHA. Open only: a force-pushed SHA can also
          # belong to a closed one.
          pr="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq 'map(select(.state == "open")) | .[0].number // empty')"

          if [ -z "$pr" ]; then
            echo "::warning::No pull request found for $HEAD_SHA; commit status posted, comment skipped."
            exit 0
          fi

          # Marker is keyed per workflow: the two dispatched workflows run
          # concurrently and would race a shared comment. Re-runs update in place.
          marker="<!-- dependabot-full-ci: $WORKFLOW_NAME -->"
          body="$marker
          **$WORKFLOW_NAME: $STATE** -- [full CI run]($RUN_URL)

          Jobs: $TALLY. Dispatched runs are not attached to the pull request, so
          these results do not appear in the Checks tab above."

          existing="$(gh api --paginate --slurp "repos/$REPO/issues/$pr/comments?per_page=100" \
            | jq -r --arg m "$marker" \
              'flatten | map(select(.body != null and (.body | contains($m)))) | .[0].id // empty')"

          if [ -n "$existing" ]; then
            echo "Updating existing comment $existing on pull request #$pr"
            jq -n --arg body "$body" '{body: $body}' \
              | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - --silent
          else
            echo "Creating comment on pull request #$pr"
            jq -n --arg body "$body" '{body: $body}' \
              | gh api -X POST "repos/$REPO/issues/$pr/comments" --input - --silent
          fi
