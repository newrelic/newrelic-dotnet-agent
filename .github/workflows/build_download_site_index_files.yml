name: Build Download Site Index Files
run-name: Indexing ${{ inputs.bucket }}/${{ inputs.prefix }} in ${{inputs.aws-region}} (dry-run=${{inputs.dry-run}}) by @${{ github.actor }}

# The job assumes the release AWS role (RELEASE_DEPLOY_ROLE_ARN) over OIDC and reads BUCKET_NAME
# ("s3://<bucket>"); both are secrets of the "release" environment, read directly by the job below.
# They are not workflow_call secrets: environment secrets cannot be passed in from a caller.
on:
  workflow_call:
    inputs:
      aws-region:
        description: 'AWS region s3 bucket is in'
        required: true
        type: string
      prefix:
        description: 'object prefix to build index.html for'
        required: false
        type: string
      dry-run:
        description: 'If true, do a dry run -- output indicates files that would be generated but nothing actually gets uploaded'
        required: false
        default: true
        type: boolean  
  workflow_dispatch:
    inputs:
      aws-region:
        description: 'AWS region s3 bucket is in'
        required: true
        type: string
      prefix:
        description: 'object prefix to build index.html for'
        required: false
        type: string
      dry-run:
        description: 'If true, do a dry run -- output indicates files that would be generated but nothing actually gets uploaded'
        required: false
        default: true
        type: boolean  

permissions:
  contents: read
  packages: read

jobs:
  s3-build-index:
    name: Build index.html files
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: read
      id-token: write # to assume the release AWS role
    container:
      image: ghcr.io/newrelic/s3indexer # Built from https://github.com/newrelic/s3-indexer
    steps:
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.RELEASE_DEPLOY_ROLE_ARN }}
      - name: Update index.html files in AWS S3 bucket
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          DRY_RUN: ${{ inputs.dry-run }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          # BUCKET_NAME is "s3://<bucket>"; s3-indexer wants the bare bucket name.
          if [ "$DRY_RUN" = true ]; then
            /opt/nr/bin/s3-indexer -bucket "${BUCKET_NAME:5}" -prefix "$PREFIX"
          else
            /opt/nr/bin/s3-indexer -bucket "${BUCKET_NAME:5}" -prefix "$PREFIX" -upload
          fi
