# The following must be set either in environment variables or via a .env file in the same folder as this file:
#
# See docker-compose-base.yml for common required variables.
# CONTAINER_NAME       The name for the container
# AWSSDK_INITCOLLECTIONS
#
# To build and run, execute `docker compose -f <path to docker-compose.yml> up`
# Alternatively, set COMPOSE_FILE environment variable to the path and omit the -f parameter

services:
    floci:
        # AWS emulator. All services (SQS, Kinesis, Firehose, S3, STS, DynamoDB) are enabled by
        # default and served on one port, so no SERVICES list and no separate DynamoDB container.
        image: floci/floci:1.7.0@sha256:bec9b9f749322444a57fb0f00d3e007ffd49015162361aab84ccecd9b4f5f8ed
        expose: # ports are only available internal to the service, not external so there's no chance for conflicts
            - "4566"
        environment:
            # floci configuration: https://floci.io/floci/ - floci maps DEBUG to its own log level
            - DEBUG=${DEBUG:-0}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    awssdktestapp:
        extends:
            file: docker-compose-base.yml
            service: base-app
        depends_on:
            floci:
                condition: service_healthy
        container_name: ${CONTAINER_NAME}
        image: ${CONTAINER_NAME}
        platform: ${PLATFORM}
        build:
            args:
                AWSSDK_INITCOLLECTIONS: ${AWSSDK_INITCOLLECTIONS}

networks:
    default:
        driver: bridge
        driver_opts:
          com.docker.network.bridge.enable_icc: "true"
